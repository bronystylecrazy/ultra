# The config this fixture was captured with — the plugin reads it back for the
# `gen: go:` facts sqlc never sends: the overrides (none here) and the nullable
# rendering.
version: "2"
plugins:
  - name: ultra
    process:
      cmd: ultra
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "queries"
    codegen:
      - plugin: ultra
        out: "gen"
    gen:
      go:
        package: "gen"
        out: "gen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
